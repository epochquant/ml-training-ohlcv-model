# ============================================================
# Kronos High-Volatility Fine-Tuning Configuration — TEMPLATE
# GCS Bucket: epochquant-training
# Model variant: high-volatility-model (separate from the base kronos pipeline)
# Copy this file into configs/high_volatility/ and edit for each symbol/timeframe.
# ============================================================

experiment:
  name: "kronos_hv_template_1m"     # Used for log dirs and checkpoint folders
  seed: 42
  model_variant: "high-volatility-model"

# ---------------------------------------------------------------
# Data — GCS paths
# Convention: gs://epochquant-training/high-volatility/training-data/<symbol>_<timeframe>.csv
# ---------------------------------------------------------------
data:
  data_path: "gs://epochquant-training/high-volatility/training-data/template_1m.csv"
  gcs_project: null               # Set to your GCP project ID if needed
  symbol: "template"
  timeframe: "1m"
  begin_time: "2024-01-01"
  end_time: "2026-06-01"
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  clip: 5.0                       # Soft-clip bound for normalization (Area A)

# ---------------------------------------------------------------
# Model — HuggingFace pretrained base IDs (warm-start, per Area B1)
# ---------------------------------------------------------------
model:
  pretrained_tokenizer_path: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor_path: "NeoQuasar/Kronos-base"
  lookback_window: 400
  predict_window:  60
  max_context:     512
  n_regime_features: 3            # Area B: [atr_pct, overextension, vol_ratio]

# ---------------------------------------------------------------
# High-volatility-specific behavior (Areas A / B / C / D)
# ---------------------------------------------------------------
high_volatility:
  normalization_mode: "logreturn"   # "logreturn" | "robust"  (Area A)
  soft_clip: true                   # tanh soft clip instead of hard clip (Area A)
  regime_embedding:
    enabled: true                   # Area B (zero-initialized additive embedding)
    atr_window: 14
    trend_window: 50
    vol_window: 20
  label_mode: "atr_relative"        # Area C
  k_drop: 2.5                       # forward-drop threshold, in ATR multiples
  k_upside: 0.6                     # forward-upside threshold, in ATR multiples
  n_extra_features: 4               # atr_pct, overextension, vol_ratio, upper_wick_ratio
  predict_quantiles: [0.1, 0.5, 0.9]  # Area D
  sample_count: 20                    # raised so quantiles are meaningful

# ---------------------------------------------------------------
# Training hyperparameters
# ---------------------------------------------------------------
training:
  # Tokenizer stage
  tokenizer_epochs:         3
  tokenizer_learning_rate:  1.0e-5

  # Predictor stage
  basemodel_epochs:          3
  predictor_learning_rate:  1.0e-5

  batch_size:          8
  num_workers:         2
  accumulation_steps:  1
  adam_weight_decay:   1.0e-4
  adam_beta1:          0.9
  adam_beta2:          0.999
  log_interval:        10

# ---------------------------------------------------------------
# Output paths
# Use GCS for cloud training:
#   base_save_path: "gs://epochquant-training/high-volatility/models/template_1m_run1"
# ---------------------------------------------------------------
output:
  base_save_path:             "./output_models_hv/template_1m_run1"
  tokenizer_save_folder:      "tokenizer_finetuned"
  predictor_save_folder:      "predictor_finetuned"

  # Paths computed automatically from above — override if needed
  finetuned_tokenizer_path:   null   # null = auto
  finetuned_predictor_path:   null   # null = auto

# ---------------------------------------------------------------
# Flags
# ---------------------------------------------------------------
flags:
  pre_trained_tokenizer:  true   # false = random init
  pre_trained_predictor:  true   # false = random init
  use_comet:              false  # Comet ML experiment tracking
  comet_project:          "kronos-crypto-hv"
  comet_workspace:        ""
